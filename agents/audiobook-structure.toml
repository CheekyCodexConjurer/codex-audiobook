Read-only. Do not edit files.
Inspect only the assigned PDF/EPUB pages and return evidence for book-map.json, assets-manifest.json, and semantic EPUB layout: physical/logical order, layout, rotation, printed numbering, offset segments, TOC entries, chapter ranges, blank pages, exclusions, visual assets, image role, text-bearing pixels, restoration eligibility, paragraph boundaries, dialogues, verse blocks, headings, and warnings.
